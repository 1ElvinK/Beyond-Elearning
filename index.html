<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond | E-Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; color: #1e293b; }
        .main-card { border-radius: 24px; border: 1px solid #e2e8f0; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); background: #ffffff; }
        
        .progress-wrapper { margin-bottom: 2rem; }
        .progress-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: 0.1em; margin-bottom: 8px; }
        .pipe-container { width: 100%; height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
        #waterLevel { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), #60a5fa); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .section { display: none; }
        .active { display: block; animation: fadeUp 0.5s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-primary { background: var(--primary); border: none; padding: 14px; border-radius: 12px; font-weight: 600; }
        .module-list { border-left: 3px solid #e2e8f0; padding-left: 20px; list-style: none; }
        .module-item { margin-bottom: 12px; font-weight: 500; color: #475569; }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 550px;">
    <!-- LOGO INSERTED HERE -->
    <div class="text-center mb-4">
        <img src="logo.png" alt="Organization Logo" style="max-height: 80px; width: auto;">
    </div>

    <div class="card main-card p-5">
        <div id="progressArea" class="d-none progress-wrapper">
            <div id="currentTitle" class="progress-title">Section A</div>
            <div class="pipe-container"><div id="waterLevel"></div></div>
        </div>
        
        <div id="sect_login" class="section active">
            <h1 class="h3 mb-4">Portal Access</h1>
            <input type="password" id="passInput" class="form-control mb-3" placeholder="Access Code">
            <button class="btn btn-primary w-100" onclick="login()">Enter Portal</button>
        </div>

        <div id="sect_instruct" class="section">
            <h1 class="h3 mb-4">Welcome</h1>
            <input type="text" id="nameInput" class="form-control mb-4" placeholder="Your Full Name">
            <div class="module-list mb-4">
                <div class="module-item">A: Introduction to Beyond</div>
                <div class="module-item">B: Who do we serve?</div>
                <div class="module-item">C: Rental Neighbourhoods</div>
                <div class="module-item">D: What do you see?</div>
                <div class="module-item">E: Our Approach</div>
            </div>
            <button class="btn btn-primary w-100" onclick="startCourse()">Begin Training</button>
        </div>

        <!-- Section A Example -->
        <div id="sect_A" class="section">
            <h2 class="h4 mb-4">A: Introduction to Beyond</h2>
            <div class="ratio ratio-16x9 rounded-4 overflow-hidden mb-4 shadow-sm">
                <iframe src="https://www.youtube.com/embed/VIDEO_ID_A" allowfullscreen></iframe>
            </div>
            <button class="btn btn-primary w-100" onclick="showSection('sect_B')">Proceed to Next</button>
        </div>

        <!-- Section D (Hotspot Example) -->
        <div id="sect_D" class="section">
            <h2 class="h4 mb-4">D: What do you see?</h2>
            <p>Click the strength area in the image below:</p>
            <img src="activity.jpg" class="img-fluid rounded mb-4" onclick="handleHotspot(event)" style="cursor:pointer;">
            <button id="btnD" class="btn btn-secondary w-100" disabled onclick="showSection('sect_E')">Unlock by clicking image</button>
        </div>

        <div id="sect_F" class="section">
            <h2 class="h3 mb-4">Training Complete</h2>
            <p>Name: <span id="outName"></span></p>
            <button class="btn btn-primary w-100" onclick="window.print()">Download Certificate</button>
        </div>
    </div>
</div>

<script>
    const sectionMap = {
        'sect_A': { title: 'A: Introduction', width: '16%' },
        'sect_B': { title: 'B: Who do we serve?', width: '33%' },
        'sect_C': { title: 'C: Rental Neighbourhoods', width: '50%' },
        'sect_D': { title: 'D: What do you see?', width: '66%' },
        'sect_E': { title: 'E: Our Approach', width: '83%' },
        'sect_F': { title: 'F: Training Complete', width: '100%' }
    };

    function login() { if(document.getElementById('passInput').value === "Volunteer2026") showSection('sect_instruct'); }
    function startCourse() { 
        localStorage.setItem('vName', document.getElementById('nameInput').value);
        document.getElementById('progressArea').classList.remove('d-none');
        showSection('sect_A'); 
    }
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('currentTitle').innerText = sectionMap[id].title;
        document.getElementById('waterLevel').style.width = sectionMap[id].width;
    }
    function handleHotspot(e) { 
        alert("Correct!"); 
        const btn = document.getElementById('btnD');
        btn.disabled = false; btn.classList.replace('btn-secondary', 'btn-primary');
    }
</script>
</body>
</html>
